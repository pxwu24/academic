<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Echelon Miner: an interactive Gaussian-elimination game for MAT 331."><meta name="theme-color" content="#07121c"><title>Echelon Miner · MAT 331</title><style>html,body{min-height:100%;margin:0}body{display:grid;place-items:center;background:linear-gradient(145deg,#07121c,#112434);color:#f8f4e6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.loading{max-width:520px;padding:38px;text-align:center}.pick{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 18px;border-radius:19px;color:#251a03;background:#f4c642;font-size:34px;box-shadow:0 15px 34px rgba(244,198,66,.25)}h1{margin:0;font-size:clamp(28px,5vw,44px)}p{color:#b9c5ce;line-height:1.6}.bar{height:7px;margin-top:24px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.09)}.bar:after{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:#63dce6;animation:load 1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(140%)}}</style></head><body><main class="loading" id="loadingStatus"><div class="pick" aria-hidden="true">⛏</div><h1>Echelon Miner</h1><p>Loading the interactive matrix mine…</p><div class="bar" aria-hidden="true"></div></main><script>window.__EM_PAYLOAD=[];</script><script src="echelon-miner/payload-1.js"></script><script src="echelon-miner/payload-2.js"></script><script src="echelon-miner/payload-3.js"></script><script src="echelon-miner/payload-4.js"></script><script src="echelon-miner/payload-5.js"></script><script src="echelon-miner/payload-6.js"></script><script>(async()=>{try{const encoded=window.__EM_PAYLOAD.join("");const compressed=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(error){const status=document.getElementById("loadingStatus");status.innerHTML='<div class="pick" aria-hidden="true">!</div><h1>Unable to load the game</h1><p>Please open this page in a current version of Chrome, Edge, Firefox, or Safari.</p>';console.error(error)}})();</script></body></html>
